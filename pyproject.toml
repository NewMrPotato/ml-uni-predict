[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexpredict"
dynamic = ["version"]
description = "Composable, framework-agnostic inference for tabular machine learning models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NewMrPotato" }]
keywords = ["machine-learning", "inference", "ensemble", "pytorch", "tensorflow", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.2", "joblib>=1.2"]
torch = ["torch>=2.0"]
tensorflow = ["tensorflow>=2.12"]
pandas = ["pandas>=1.5"]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
]
all = [
    "scikit-learn>=1.2",
    "joblib>=1.2",
    "torch>=2.0",
    "tensorflow>=2.12",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://github.com/NewMrPotato/ml-flex-predict"
Repository = "https://github.com/NewMrPotato/ml-flex-predict"
Issues = "https://github.com/NewMrPotato/ml-flex-predict/issues"

[tool.setuptools.packages.find]
include = ["flexpredict*"]

[tool.setuptools.package-data]
flexpredict = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "flexpredict.__version__" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "sklearn: integration tests requiring scikit-learn and joblib",
    "torch: integration tests requiring PyTorch",
    "tensorflow: integration tests requiring TensorFlow/Keras",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["flexpredict"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["joblib", "torch", "tensorflow"]
ignore_missing_imports = true
