name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core test dependencies
        run: python -m pip install -e . pytest pytest-cov
      - name: Test
        run: >-
          python -m pytest
          --cov=flexpredict
          --cov-report=term-missing
          --cov-fail-under=85
          -q

  quality:
    name: Static quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check flexpredict tests examples
      - name: Type-check against minimum supported Python
        run: python -m mypy flexpredict

  package:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "from importlib.metadata import version; import flexpredict; assert version('flexpredict') == flexpredict.__version__"

  framework-integration:
    name: Integration (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: sklearn
            extras: sklearn,pandas
            test-file: tests/integration/test_sklearn.py
          - framework: torch
            extras: torch
            test-file: tests/integration/test_torch.py
          - framework: tensorflow
            extras: tensorflow
            test-file: tests/integration/test_tensorflow.py

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install framework extra
        run: python -m pip install -e ".[${{ matrix.extras }}]" pytest
      - name: Run framework integration tests
        run: python -m pytest ${{ matrix.test-file }} -q
