name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+)?", tag) is None:
              raise SystemExit(f"Invalid release tag: {tag!r}")

          module = ast.parse(Path("flexpredict/__init__.py").read_text(encoding="utf-8"))
          package_version = None
          for node in module.body:
              if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                  continue
              targets = node.targets if isinstance(node, ast.Assign) else [node.target]
              if any(isinstance(target, ast.Name) and target.id == "__version__" for target in targets):
                  package_version = ast.literal_eval(node.value)
                  break

          if not isinstance(package_version, str):
              raise SystemExit("Could not read flexpredict.__version__")
          if tag != f"v{package_version}":
              raise SystemExit(
                  f"Tag {tag!r} does not match package version v{package_version}"
              )
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flexpredict
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
